# Local development: file-based H2 in MySQL mode, demo data, default admin. No MySQL needed.
spring:
  datasource:
    url: jdbc:h2:file:./data/mms-dev;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;NON_KEYWORDS=VALUE
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
mms:
  seed-demo-data: ${SEED_DEMO_DATA:true}
  bootstrap:
    admin-email: ${ADMIN_EMAIL:admin@mms.local}
    admin-password: ${ADMIN_PASSWORD:ChangeMe123!}
