# Local MySQL 8 (see docker-compose.yml). Same engine as JawsDB.
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mms}?serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:mms}
    password: ${DB_PASSWORD:mms}
mms:
  seed-demo-data: ${SEED_DEMO_DATA:true}
  bootstrap:
    admin-email: ${ADMIN_EMAIL:admin@mms.local}
    admin-password: ${ADMIN_PASSWORD:ChangeMe123!}
