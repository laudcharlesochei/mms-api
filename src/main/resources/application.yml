# Mentor Management System API - V1 (Spring Boot + JawsDB MySQL)
# All configuration comes from environment variables (12-factor). See README for the full list.
spring:
  application:
    name: mms-api
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}
  task:
    scheduling:
      pool:
        size: 2

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    mail:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

mms:
  auth:
    # local = email + password + TOTP MFA issued by this API; entra = Microsoft Entra ID tokens
    mode: ${AUTH_MODE:local}
    jwt-secret: ${JWT_SECRET:}
    issuer: mms-api
    access-token-minutes: ${ACCESS_TOKEN_MINUTES:15}
    refresh-token-minutes: ${IDLE_TIMEOUT_MINUTES:30}
    max-failed-logins: 5
    lockout-minutes: 15
    require-mfa: ${REQUIRE_MFA:false}
    entra:
      tenant-id: ${ENTRA_TENANT_ID:}
      client-id: ${ENTRA_CLIENT_ID:}
      audience: ${ENTRA_AUDIENCE:}
      api-scope: ${ENTRA_API_SCOPE:}
      auto-provision: ${ENTRA_AUTO_PROVISION:false}
  cors-allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  frontend-url: ${FRONTEND_URL:${CORS_ALLOWED_ORIGIN:http://localhost:5173}}
  notes-encryption-key: ${NOTES_ENCRYPTION_KEY:}
  edit-window-days: ${EDIT_WINDOW_DAYS:14}
  ip-hash-salt: ${IP_HASH_SALT:mms}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@mms.local}
    send-to-aos: ${MAIL_SEND_TO_AOS:true}
    send-to-student: ${MAIL_SEND_TO_STUDENT:false}
    attach-pdf: ${MAIL_ATTACH_PDF:true}
  retention:
    enabled: ${RETENTION_ENABLED:false}
    years: ${RETENTION_YEARS:6}
    cron: "0 30 2 1 * *"
  reminders:
    enabled: ${REMINDERS_ENABLED:false}
    cron: ${REMINDERS_CRON:0 0 9 * * MON}
    zone: Europe/London
    due-window-days: ${REMINDERS_DUE_WINDOW_DAYS:21}
  features:
    messaging: ${FEATURE_MESSAGING:true}
  bootstrap:
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}
    admin-name: ${ADMIN_NAME:MMS Administrator}
    admin-reset: ${ADMIN_RESET:false}
  seed-demo-data: ${SEED_DEMO_DATA:false}
  rate-limit:
    login-per-minute: ${RATE_LIMIT_LOGIN:10}
    writes-per-minute: ${RATE_LIMIT_WRITES:120}
